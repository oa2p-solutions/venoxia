schema_version: "1.0"
name: charter-resume
description: >-
  Retomar un acta: el proyecto ya tiene `.venoxia/charter.md` con dos capabilities y dos
  apuestas. La skill tiene que empezar por el estado (propósito, capability en curso,
  bloqueos), agrupar las apuestas en una sola vista y hacer una sola pregunta con tres
  intenciones, sin preguntar apuesta por apuesta ni mirar la fecha de los ficheros.
tags: [charter, interview, resume]
context:
  add_dirs: ["./project"]
execution:
  prompt: |
    Lo que sé de mi proyecto: ya tiene acta, la hicimos la semana pasada. Quiero
    continuar: seguir con la siguiente capability. No hay ninguna apuesta que resolver
    hoy ni ninguna sección que revisar.

    Trabajas sobre un proyecto que quiere adoptar Venoxia. Su raíz es el directorio
    `project/`, que se te ha añadido a esta sesión como directorio de trabajo adicional.
    Localízalo antes de nada si no lo tienes a la vista.

    Invoca la skill `/venoxia:charter` y sigue sus pasos. Una restricción de esta sesión:
    **no hay nadie al otro lado**, así que `AskUserQuestion` no está disponible y no debes
    llamarla ni una vez. Todo lo que yo sé está en este mensaje. Cada vez que la skill te
    pida preguntarme algo, haz lo siguiente en vez de preguntar: busca la respuesta en lo
    que te he contado; si está, úsala con mis palabras; si no está, no la inventes para el
    acta —déjala como apuesta o fuera— y anótalo. Lleva un registro en
    `interview-log.json`, dentro de tu directorio de trabajo actual (no dentro de
    `project/`), como una lista JSON con una entrada por pregunta que habrías hecho, en
    el orden en que la habrías hecho, con esta forma exacta:
    `{"order": 1, "slot": "<casilla del mapa de cobertura o \"confirmation\">",
    "kind": "question" | "confirmation", "question": "<la pregunta literal que habrías
    hecho>", "answer": "<mi respuesta, tomada de este mensaje, o null si no la tengo>"}`.
    Una confirmación del borrador es `kind: confirmation`; una pregunta por una casilla
    que falta es `kind: question`.

    Cuando el acta esté escrita y el linter haya pasado, guarda la salida JSON íntegra
    de la última ejecución de `charter_lint.py` en `charter-lint-result.json`, también en
    tu directorio de trabajo actual, sin editarla.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill]
runs: 2
expected_outcome: >-
  El registro tiene una sola pregunta, con las tres intenciones (continuar, revisar una
  sección, resolver una apuesta), no una por apuesta; el acta no cambia; la entrega termina
  con el `/venoxia:specify` de la capability `booking`.
graders:
  - type: tool_used
    name: no-question-to-the-user
    tool: AskUserQuestion
    min: 0
    max: 0
  - type: file_exists
    name: charter-written
    path: project/.venoxia/charter.md
  - type: file_exists
    name: principles-written
    path: project/.venoxia/principles.md
  - type: file_exists
    name: interview-log-written
    path: interview-log.json
  - type: file_exists
    name: lint-result-written
    path: charter-lint-result.json
  - type: regex
    name: charter-passes-the-linter
    target:
      source: file
      path: charter-lint-result.json
    pattern: '"ok":\s*true'
  - type: regex
    name: no-inference-mark-left
    target:
      source: file
      path: project/.venoxia/charter.md
    pattern: '<!-- inferred -->'
    match: not_contains
  - type: regex
    name: no-python-traceback
    target: trace
    pattern: 'Traceback \(most recent call last\)'
    match: not_contains
  - type: tool_used
    name: venoxia-skill-fired
    tool: Skill
    min: 1
    arm: with-only

  - type: regex
    name: one-question-with-three-intentions
    target:
      source: file
      path: interview-log.json
    pattern: '(?is)"question":\s*"[^"]*continuar[^"]*(revisar|secci)[^"]*(resolver|apuesta)'
  - type: regex
    name: no-question-per-bet
    target:
      source: file
      path: interview-log.json
    pattern: '(?i)B-00[12]'
    match: not_contains
  - type: regex
    name: the-charter-is-untouched
    target:
      source: file
      path: project/.venoxia/charter.md
    pattern: 'B-002 · Diez reservas por noche bastan'
  - type: regex
    name: hands-over-the-next-specify
    target: last_message
    pattern: '/venoxia:specify'
  - type: regex
    name: no-mtime-in-the-reasoning
    target: trace
    pattern: '(?i)mtime|stat\(|más reciente'
    match: not_contains
  - type: llm
    name: resume-starts-with-the-state
    focus:
      source: file
      path: interview-log.json
    criteria: >-
      La única pregunta anotada ofrece las tres intenciones —continuar con la siguiente
      capability, revisar una sección o resolver una apuesta cuyo hecho ya ocurrió— en una
      sola llamada, y no hay ninguna pregunta específica sobre B-001 ni sobre B-002. La
      respuesta anotada es la del usuario: continuar.
    weight: 0.5
