schema_version: "1.0"
name: budget-exceeded
description: >-
  Cinco requisitos en el ámbito, dos de ellos con `confidence: low`: el 40 %, por encima
  del presupuesto de incertidumbre del 30 %. El validador tiene que rechazarlo, y tiene
  que rechazarlo por V11 en concreto.
tags: [validator, budget, confidence, must-fail]
context:
  add_dirs: ["./project"]
execution:
  prompt: |
    Trabajas sobre un proyecto que usa Venoxia. Su raíz es el directorio `project/`, que
    se te ha añadido a esta sesión como directorio de trabajo adicional; dentro tiene su
    especificación en `.venoxia/`. Localízalo antes de nada si no lo tienes a la vista.

    Valida la especificación de ese proyecto y guarda la salida JSON íntegra del
    validador en `validation-result.json`, dentro de tu directorio de trabajo actual.
    Cópiala tal cual: sin editarla, sin resumirla y sin reformatearla.

    No arregles la especificación ni toques nada bajo `project/`: aquí solo se valida.
    Que la validación termine con un código de salida distinto de cero no es un fallo
    de la herramienta: es justo el resultado que se te pide capturar.

    Termina con dos frases como mucho: si la especificación cumple el contrato y, si no
    lo cumple, qué regla la rechaza y con qué cifras.
  max_turns: 14
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash, Write, Skill]
runs: 2
expected_outcome: >-
  El validador rechaza la especificación (ok false) por la regla V11 y solo por ella, con
  el presupuesto calculado en 2 requisitos low sobre 5, sin ningún aviso y sin fallos de
  parseo.
graders:
  - type: tool_used
    name: validator-script-ran
    tool: Bash
    input_match: 'validate\.py'
    min: 1
  - type: file_exists
    name: validation-result-written
    path: validation-result.json
  - type: regex
    name: spec-rejected
    target:
      source: file
      path: validation-result.json
    pattern: '"version":\s*1,\s*"ok":\s*false'
    flags: "s"
  - type: regex
    name: rule-v11-fired
    target:
      source: file
      path: validation-result.json
    pattern: '"rule":\s*"V11"'
  - type: regex
    name: v11-is-an-error
    target:
      source: file
      path: validation-result.json
    pattern: '"rule":\s*"V11",\s*"severity":\s*"error"'
    flags: "s"
  - type: regex
    name: only-v11-fired
    target:
      source: file
      path: validation-result.json
    pattern: '"rule":\s*"(?!V11")'
    match: not_contains
  - type: regex
    name: budget-arithmetic-is-right
    target:
      source: file
      path: validation-result.json
    pattern: '"budget":\s*\{\s*"low":\s*2,\s*"total":\s*5'
    flags: "s"
  - type: regex
    name: budget-marked-as-blown
    target:
      source: file
      path: validation-result.json
    pattern: '"limit":\s*0\.3,\s*"ok":\s*false'
    flags: "s"
  - type: regex
    name: no-warning-raised
    target:
      source: file
      path: validation-result.json
    pattern: '"warning":\s*0'
  - type: regex
    name: no-python-traceback
    target: trace
    pattern: 'Traceback \(most recent call last\)'
    match: not_contains
  - type: tool_used
    name: venoxia-skill-fired
    tool: Skill
    min: 1
    arm: with-only
